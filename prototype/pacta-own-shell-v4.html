<!doctype html>
<!--
  PROTOTYPE ONLY — Pacta's own mobile information architecture.
  The reference question is: can a four-tab shell combine the board and data view
  while keeping National Focus Tree and Focus Chain as separate workspaces?
  Switch entry surfaces with ?variant=A|B|C. State is in-memory only.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pacta Own Shell Prototype</title>
  <style>
    :root {
      --paper: #f5f1e9;
      --paper-2: #eee8dd;
      --panel: #fcfaf6;
      --ink: #202b39;
      --muted: #798391;
      --line: #d8d1c5;
      --blue: #356b91;
      --blue-2: #dceaf0;
      --orange: #dc754e;
      --orange-2: #fae4d9;
      --green: #6eaa9a;
      --green-2: #dcece6;
      --purple: #74688b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; background: #d9d4ca; color: var(--ink); }
    body { min-height: 100vh; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
    .app { width: min(100%, 460px); min-height: 100vh; margin: auto; padding-bottom: 96px; background: var(--paper); }
    .app.board { background: var(--paper); }
    .app.tree { background: #f9f7f2; }
    .app.chain { background: #f1f5f5; }
    .app.me { background: #eeece8; }
    .page { min-height: calc(100vh - 96px); padding: 24px 22px 36px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .kicker { color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 31px; line-height: 1.05; letter-spacing: -.07em; }
    h2 { font-size: 20px; letter-spacing: -.045em; }
    h3 { font-size: 14px; letter-spacing: -.02em; }
    .intro { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .header-tools { display: flex; gap: 4px; }
    .tool { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
    .tool:first-child { border-radius: 10px 0 0 10px; }
    .tool:last-child { border-radius: 0 10px 10px 0; }
    .tool svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .section-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
    .section-label span { color: var(--muted); font-size: 11px; }
    .rule { height: 1px; background: var(--line); }
    .board-hero { display: grid; grid-template-columns: 1fr auto; gap: 15px; margin-top: 26px; padding: 20px 18px; border: 1px solid var(--line); border-left: 5px solid var(--blue); background: var(--panel); }
    .board-hero strong { display: block; margin-top: 8px; font-size: 22px; letter-spacing: -.05em; }
    .board-hero p { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .hero-value { align-self: center; color: var(--blue); font-size: 36px; font-weight: 900; letter-spacing: -.1em; }
    .action-link { border: 0; border-bottom: 1px solid currentColor; background: transparent; color: var(--blue); cursor: pointer; font-size: 12px; font-weight: 850; }
    .board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .board-stat { padding: 15px; border-top: 3px solid var(--line); background: var(--panel); }
    .board-stat.blue { border-color: var(--blue); }
    .board-stat.green { border-color: var(--green); }
    .board-stat.orange { border-color: var(--orange); }
    .board-stat.purple { border-color: var(--purple); }
    .board-stat span { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .board-stat strong { display: block; margin-top: 12px; font-size: 25px; letter-spacing: -.08em; }
    .board-tasks { border-top: 1px solid var(--line); background: var(--panel); }
    .task-row { display: grid; grid-template-columns: 8px 1fr auto; gap: 11px; align-items: center; padding: 14px 13px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; }
    .task-row:last-child { border-bottom: 0; }
    .task-row i { display: block; width: 8px; height: 8px; background: var(--blue); }
    .task-row:nth-child(2) i { background: var(--orange); }

    .task-row span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .task-row b { color: var(--blue); font-size: 11px; }
    .pulse-panel { padding: 17px; border: 1px solid var(--line); background: var(--panel); }
    .pulse-row { display: flex; align-items: center; gap: 12px; }
    .pulse-rail { position: relative; width: 9px; height: 68px; background: var(--blue-2); }
    .pulse-rail::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 74%; background: var(--green); }
    .pulse-copy { flex: 1; }
    .pulse-copy strong { display: block; font-size: 16px; }
    .pulse-copy p { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .pulse-badge { padding: 6px 8px; background: var(--green-2); color: #427b6d; font-size: 10px; font-weight: 850; }
    .mini-chart { display: flex; align-items: end; gap: 7px; height: 86px; padding-top: 15px; }
    .mini-chart i { flex: 1; min-height: 8px; background: var(--blue); opacity: .22; }
    .mini-chart i:nth-child(2n) { opacity: .45; }
    .mini-chart i:last-child { opacity: 1; background: var(--orange); }
    .chart-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; }
    .tree-stage { position: relative; min-height: 560px; margin-top: 25px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
    .tree-stage::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #ece7df; }
    .tree-map { position: relative; z-index: 1; display: grid; justify-items: center; padding-top: 42px; }
    .tree-node { position: relative; z-index: 2; width: 164px; padding: 13px 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; text-align: left; box-shadow: 6px 6px 0 rgba(53,107,145,.08); }
    .tree-node::before { content: ""; display: block; width: 24px; height: 4px; margin-bottom: 11px; background: var(--blue); }
    .tree-node.selected { border-color: var(--orange); box-shadow: 6px 6px 0 var(--orange-2); }
    .tree-node.off { opacity: .55; filter: grayscale(.6); }

    .tree-node.root::before { background: var(--green); }
    .tree-node strong { display: block; font-size: 14px; }

    .tree-node time { display: block; margin-top: 9px; color: var(--blue); font-size: 10px; font-weight: 850; }
    .tree-trunk { width: 1px; height: 44px; background: var(--blue); }
    .tree-branch { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: calc(100% - 20px); margin-top: 0; padding-top: 34px; }
    .tree-branch::before { content: ""; position: absolute; top: 0; left: 16.66%; right: 16.66%; height: 1px; background: var(--blue); }
    .tree-branch::after { content: ""; position: absolute; top: -44px; left: 50%; width: 1px; height: 44px; background: var(--blue); }
    .branch-child { position: relative; }
    .branch-child::before { content: ""; position: absolute; top: -34px; left: 50%; width: 1px; height: 34px; background: var(--blue); }
    .tree-branch .tree-node { width: 100%; min-height: 131px; padding: 10px 8px; box-shadow: 4px 4px 0 rgba(53,107,145,.06); }
    .tree-branch .tree-node strong { font-size: 11px; }
    .tree-branch .tree-node p { font-size: 9px; }
    .tree-descendant { position: relative; display: flex; justify-content: center; margin-top: 44px; }
    .tree-descendant::before { content: ""; position: absolute; top: -44px; left: 50%; width: 1px; height: 44px; background: var(--blue); }
    .tree-descendant .tree-node { width: 130px; }
    .tree-legend { display: flex; justify-content: center; gap: 13px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .tree-legend i { display: inline-block; width: 7px; height: 7px; margin-right: 4px; background: var(--green); }
    .tree-legend i.orange { background: var(--orange); }
    .chain-header { display: flex; align-items: end; justify-content: space-between; gap: 14px; }
    .chain-header .chain-index { color: var(--orange); font-size: 41px; font-weight: 900; letter-spacing: -.1em; }
    .chain-switch { display: grid; grid-template-columns: 1fr 1fr; margin-top: 24px; border-bottom: 1px solid var(--line); }
    .chain-switch button { padding: 13px 10px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-weight: 850; }
    .chain-switch button.active { border-color: var(--orange); color: var(--ink); }
    .chain-menu { margin-top: 13px; border: 1px solid var(--line); background: var(--paper); }
    .chain-menu button { width: 100%; padding: 11px 13px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 11px; font-weight: 850; }
    .chain-menu p { padding: 0 13px 12px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .focus-form { margin-top: 20px; padding: 19px; border: 1px solid var(--line); background: var(--panel); }
    .field-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .target-button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 13px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-weight: 850; text-align: left; }
    .target-button span { color: var(--blue); }
    .target-button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .duration-line { display: flex; align-items: center; justify-content: space-between; margin-top: 23px; }
    .duration-number { color: var(--blue); font-size: 58px; font-weight: 900; letter-spacing: -.1em; }
    .duration-number small { margin-left: 6px; color: var(--muted); font-size: 18px; letter-spacing: 0; }
    .step { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 22px; }
    .signal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .signal { min-height: 136px; padding: 14px; border-top: 4px solid var(--orange); background: var(--orange-2); }
    .signal.marker { border-color: var(--purple); background: #e9e5ef; }
    .signal .signal-mark { color: var(--orange); font-size: 28px; font-weight: 900; }
    .signal.marker .signal-mark { color: var(--purple); }
    .signal strong { display: block; margin-top: 13px; font-size: 14px; }
    .signal p { margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .start-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
    .start-button { min-height: 52px; border: 1px solid var(--orange); background: transparent; color: var(--orange); cursor: pointer; font-size: 12px; font-weight: 900; }
    .start-button.primary { background: var(--orange); color: #fff; }
    .hint { margin-top: 11px; color: var(--muted); font-size: 10px; line-height: 1.5; text-align: center; }
    .data-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 25px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .data-strip > div { padding: 14px 8px; border-right: 1px solid var(--line); }
    .data-strip > div:last-child { border-right: 0; }
    .data-strip span { display: block; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .data-strip strong { display: block; margin-top: 8px; color: var(--blue); font-size: 22px; letter-spacing: -.08em; }
    .heatmap { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 13px; }
    .heatmap i { display: block; aspect-ratio: 1; background: #e4e0d8; }
    .heatmap i.l1 { background: #d3e8e1; } .heatmap i.l2 { background: #9bcabd; } .heatmap i.l3 { background: var(--blue); }
    .log-line { display: grid; grid-template-columns: 55px 1fr auto; gap: 10px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .log-line time { color: var(--muted); font-size: 10px; }
    .log-line strong { font-size: 12px; }
    .log-line span { color: var(--muted); font-size: 10px; }
    .profile { padding: 22px 0; border-bottom: 1px solid var(--line); }
    .profile-head { display: flex; align-items: center; gap: 14px; }
    .avatar { display: grid; place-items: center; width: 62px; height: 62px; border: 1px solid var(--line); background: var(--paper); color: var(--purple); font-size: 27px; }
    .profile-head strong { display: block; font-size: 22px; letter-spacing: -.06em; }
    .profile-head span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 22px; background: var(--line); }
    .profile-stats div { padding: 12px 9px; background: var(--paper); }
    .profile-stats span { display: block; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .profile-stats strong { display: block; margin-top: 8px; font-size: 20px; }
    .settings { display: grid; gap: 0; margin-top: 15px; border-top: 1px solid var(--line); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 17px 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
    .setting-row span { color: var(--muted); font-size: 11px; }
    .setting-row strong { font-size: 14px; }
    .setting-row b { color: var(--muted); font-size: 20px; font-weight: 400; }
    .secondary-page { min-height: calc(100vh - 96px); padding: 25px 22px 40px; background: var(--panel); }
    .secondary-page .back { margin-bottom: 26px; }
    .filter-row { display: flex; gap: 7px; margin-top: 19px; overflow-x: auto; }
    .filter-chip { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 850; }
    .filter-chip.active { border-color: var(--blue); background: var(--blue-2); color: var(--blue); }
    .picker-list { display: grid; gap: 9px; margin-top: 16px; }
    .picker-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 15px 13px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; text-align: left; }
    .picker-item strong { display: block; font-size: 13px; }
    .picker-item span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .picker-kind { color: var(--blue); font-size: 10px; font-weight: 900; }
    .library-list { display: grid; gap: 9px; margin-top: 20px; }
    .library-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border: 1px solid var(--line); background: var(--paper); }
    .library-card strong { display: block; font-size: 13px; }
    .library-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .library-card button, .new-card-button { padding: 8px 10px; border: 1px solid var(--blue); background: var(--blue-2); color: var(--blue); cursor: pointer; font-size: 10px; font-weight: 900; }
    .new-card-button { width: 100%; margin-top: 18px; padding: 13px; background: var(--blue); color: #fff; }
    .card-form { display: grid; gap: 9px; margin-top: 22px; }
    .card-form input, .card-form textarea { width: 100%; padding: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; }
    .card-form textarea { min-height: 84px; resize: vertical; }
    .node-symbol { display: block; margin: 3px 0 10px; color: var(--blue); font-size: 27px; line-height: 1; }
    .tree-node.icon-only { min-height: 83px; padding-top: 10px; text-align: center; }
    .tree-node.icon-only::before { margin: 0 auto 9px; }
    .tree-node.icon-only p, .tree-node.icon-only time { display: none; }
    .bottom-nav { position: fixed; z-index: 20; right: 50%; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); width: min(100%, 460px); min-height: 76px; transform: translateX(50%); padding: 9px 10px max(9px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(250,248,243,.98); }
    .nav-item { display: grid; justify-items: center; gap: 4px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 850; }
    .nav-item.active { color: var(--blue); }
    .nav-glyph { display: grid; place-items: center; width: 34px; height: 28px; border-bottom: 3px solid transparent; font-size: 20px; line-height: 1; }
    .nav-item.active .nav-glyph { border-color: var(--blue); }
    .confirm-page { min-height: calc(100vh - 96px); padding: 25px 22px 40px; background: var(--panel); }
    .back { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 850; }
    .confirm-list { display: grid; gap: 10px; margin-top: 24px; }
    .confirm-row { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; }
    .confirm-row input { width: 19px; height: 19px; accent-color: var(--blue); }
    .confirm-row div { flex: 1; }
    .confirm-row strong { display: block; font-size: 13px; }
    .confirm-row span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .confirm-row.off { opacity: .52; }
    .confirm-button { width: 100%; margin-top: 20px; padding: 14px; border: 0; background: var(--blue); color: #fff; cursor: pointer; font-size: 13px; font-weight: 900; }
    .confirm-note { margin-top: 14px; padding: 13px; border-left: 4px solid var(--orange); background: var(--orange-2); color: #8d6858; font-size: 10px; line-height: 1.6; }
    .session { display: grid; min-height: 100vh; padding: 27px 24px 30px; background: #202b39; color: #f9f5ed; }
    .session-top { display: flex; justify-content: space-between; color: #b9c6d0; font-size: 10px; font-weight: 850; letter-spacing: .13em; }
    .session-body { display: grid; align-content: center; justify-items: center; text-align: center; }
    .session-body h1 { margin-top: 22px; font-size: 29px; }
    .session-timer { margin-top: 27px; color: #f5b18d; font-size: 92px; font-weight: 900; letter-spacing: -.12em; line-height: .9; }
    .session-body p { max-width: 285px; margin-top: 22px; color: #b9c6d0; font-size: 12px; line-height: 1.6; }
    .session-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-self: end; }
    .session-button { min-height: 55px; border: 1px solid #526174; background: #2a394c; color: #fff; cursor: pointer; font-size: 13px; font-weight: 850; }
    .session-button.primary { grid-column: 1 / -1; border-color: #f5b18d; background: #f5b18d; color: #202b39; }
    .session-button.danger { color: #f5b4b4; }
    .prototype-switcher { position: fixed; z-index: 30; right: 50%; bottom: 80px; display: flex; align-items: center; gap: 4px; transform: translateX(50%); padding: 4px 6px; border: 1px solid #4d5b69; background: #202b39; color: #fff; box-shadow: 4px 4px 0 rgba(32,43,57,.14); }
    .prototype-switcher button { width: 25px; height: 25px; border: 0; background: transparent; color: #f5b18d; cursor: pointer; }
    .prototype-switcher strong { min-width: 145px; color: #d5dee4; font-size: 9px; text-align: center; }
    .toast { position: fixed; z-index: 60; left: 50%; bottom: 145px; max-width: 340px; transform: translateX(-50%); padding: 11px 14px; background: #202b39; color: #fff; box-shadow: 4px 4px 0 rgba(32,43,57,.2); font-size: 11px; font-weight: 800; text-align: center; }
    .modal-backdrop { position: fixed; z-index: 70; inset: 0; display: grid; place-items: center; padding: 22px; background: rgba(32,43,57,.56); }
    .modal { width: min(100%, 365px); padding: 21px; border: 1px solid var(--line); background: var(--panel); }
    .modal h2 { font-size: 21px; }
    .modal p { margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .modal-actions.three { grid-template-columns: 1fr 1fr 1fr; }
    .modal-actions button { padding: 12px; border: 0; background: var(--orange); color: #fff; cursor: pointer; font-size: 12px; font-weight: 850; }
    .modal-actions button.secondary { background: var(--paper-2); color: var(--ink); }

      .page { padding-left: 16px; padding-right: 16px; }
      .tree-branch { gap: 5px; width: calc(100% - 10px); }
      .tree-branch .tree-node { padding-left: 5px; padding-right: 5px; }
      .tree-branch .tree-node strong { font-size: 10px; }
      .session-timer { font-size: 76px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="prototype-switcher" class="prototype-switcher"></div>
  <script>
    const variants = { A: { label: '看板主视图', screen: 'board' }, B: { label: '国策树主视图', screen: 'tree' }, C: { label: '专注链主视图', screen: 'chain' } };
    const variantKeys = Object.keys(variants);
    const getVariant = () => { const value = new URLSearchParams(location.search).get('variant'); return variantKeys.includes(value) ? value : 'A'; };

      if (action === 'board-menu' || action === 'me-menu' || action === 'profile' || action === 'notification' || action === 'rules') { toast('设置入口只属于“我的”页面'); return; }
    }
    function openModal(title, text, kind = 'rules') { const abandon = kind === 'abandon'; const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop'; backdrop.innerHTML = `<div class="modal"><h2>${title}</h2><p>${text}</p><div class="modal-actions ${abandon ? 'three' : ''}"><button data-modal="rule">选择/创建规则</button>${abandon ? '<button data-modal="failure" class="secondary">填写失败原因</button>' : ''}<button class="secondary" data-modal="cancel">返回计时</button></div></div>`; document.body.appendChild(backdrop); backdrop.querySelector('[data-modal="cancel"]').onclick = () => backdrop.remove(); backdrop.querySelector('[data-modal="rule"]').onclick = () => { backdrop.remove(); if (kind === 'pause') { state.focusRunning = false; toast('已按例外规则暂停；继续时仍需经过规则确认'); render(); } else if (kind === 'continue') { state.focusRunning = true; toast('已按例外规则继续计时'); render(); } else if (kind === 'end') { state.screen = 'chain'; state.focusRunning = false; toast('已按例外规则提前结束，实际投入计入进度'); render(); } else if (kind === 'abandon') { state.screen = 'chain'; state.focusRunning = false; toast('已按规则保留本次进度'); render(); } else { toast('原型：已进入规则选择流程'); } }; if (abandon) backdrop.querySelector('[data-modal="failure"]').onclick = () => { backdrop.remove(); state.screen = 'chain'; state.focusRunning = false; toast('原型：已进入失败原因填写，需输入简短文字'); render(); }; }
    function toast(message) { document.querySelectorAll('.toast').forEach(el => el.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = message; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
    function cycle(direction) { const index = variantKeys.indexOf(getVariant()); const next = direction === 'next' ? (index + 1) % variantKeys.length : (index + variantKeys.length - 1) % variantKeys.length; history.replaceState(null, '', `?variant=${variantKeys[next]}`); state.screen = variants[variantKeys[next]].screen; render(); }
    window.addEventListener('keydown', event => { const tag = document.activeElement?.tagName; if (['INPUT','TEXTAREA'].includes(tag) || document.activeElement?.isContentEditable) return; if (event.key === 'ArrowLeft') cycle('prev'); if (event.key === 'ArrowRight') cycle('next'); });
    function finishSessionNormally() { state.seconds = 0; state.focusRunning = false; state.screen = 'chain'; toast('倒计时自然归零，本次 Session 正常完成，实际投入已计入进度'); render(); }
    setInterval(() => { if (state.screen === 'session' && state.focusRunning && state.seconds > 0) { state.seconds -= 1; if (state.seconds === 0) { finishSessionNormally(); return; } const timer = document.querySelector('.session-timer'); if (timer) timer.textContent = `${String(Math.floor(state.seconds / 60)).padStart(2,'0')}:${String(state.seconds % 60).padStart(2,'0')}`; } }, 1000);
    render();
  </script>
</body>
