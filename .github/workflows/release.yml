name: Release

# Builds signed Android artifacts and the Windows bundle, then publishes a
# GitHub Release that matches the `pubspec.yaml` version.
#
#   push tag vX.Y.Z   -> version check -> android + windows -> GitHub Release
#   workflow_dispatch -> version check -> the selected jobs (no Release)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      build_targets:
        description: 'Which platform artifacts to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'windows'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      android: ${{ steps.read.outputs.android }}
      windows: ${{ steps.read.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Read pubspec.yaml version and compare with the tag
        id: read
        env:
          BUILD_TARGETS: ${{ inputs.build_targets || 'all' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          declared_line = ''
          for line in Path('pubspec.yaml').read_text(encoding='utf-8').splitlines():
              if line.startswith('version:'):
                  declared_line = line.split(':', 1)[1].strip()
                  break

          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?', declared_line)
          if not match:
              print(f'::error::pubspec.yaml version must be MAJOR.MINOR.PATCH[+BUILD], got {declared_line!r}')
              sys.exit(1)

          declared = '.'.join(match.groups()[:3])
          print(f'pubspec.yaml: {declared_line}')

          targets = os.environ.get('BUILD_TARGETS', 'all').strip().lower()
          outputs = {
              'version': declared,
              'android': 'true' if targets in ('all', 'android') else 'false',
              'windows': 'true' if targets in ('all', 'windows') else 'false',
          }

          reference = os.environ['GITHUB_REF']
          if reference.startswith('refs/tags/'):
              tag = reference[len('refs/tags/'):]
              if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
                  print(f'::error::tag {tag!r} must look like vMAJOR.MINOR.PATCH')
                  sys.exit(1)
              if tag[1:] != declared:
                  print(f'::error::tag {tag} does not match pubspec.yaml version {declared} (the +BUILD suffix is not part of the tag)')
                  sys.exit(1)
              print(f'tag {tag} matches pubspec.yaml {declared}')
          else:
              print('not a tag build: tag comparison skipped')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
              for key, value in outputs.items():
                  print(f'{key}={value}', file=stream)
          PY

  android:
    name: Android APK + AAB
    needs: [version]
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python scripts/fetch_misans.py
      - run: flutter pub get

      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          required = (
              'ANDROID_KEYSTORE_BASE64',
              'ANDROID_KEYSTORE_PASSWORD',
              'ANDROID_KEY_ALIAS',
              'ANDROID_KEY_PASSWORD',
          )
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          ready = not missing

          if ready:
              print('all four Android signing secrets are present')
          else:
              print(f'::warning::Android signing secrets missing: {", ".join(missing)}')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
              print(f'ready={"true" if ready else "false"}', file=stream)

          if missing and os.environ['GITHUB_REF'].startswith('refs/tags/'):
              print('::error::A tag release needs a signed APK/AAB; configure the four Android signing secrets first.')
              sys.exit(1)
          if missing:
              print('manual run without signing secrets: the Android job is skipped, Windows artifacts are unaffected')
          PY

      - name: Restore keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          target = Path('android/app/upload-keystore.jks')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'].strip()))
          print(f'keystore restored: {target} ({target.stat().st_size} bytes)')
          PY

      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python scripts/pacta_build.py build --target apk --release
          --require-release-signing --skip-fonts --skip-pub-get

      - name: Build signed app bundle
        if: steps.signing.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python scripts/pacta_build.py build --target appbundle --release
          --require-release-signing --skip-fonts --skip-pub-get

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.signing.outputs.ready == 'true'
        with:
          name: pacta-android
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  windows:
    name: Windows release
    needs: [version]
    if: needs.version.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python scripts/fetch_misans.py
      - run: flutter pub get
      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/pacta_build.py build --target windows --release --skip-fonts --skip-pub-get
      - name: Package Windows build
        shell: pwsh
        run: |
          $source = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $source)) { throw "Windows release output missing: $source" }
          $zip = 'build/Pacta-windows-x64-release.zip'
          Compress-Archive -Path "$source/*" -DestinationPath $zip -Force
          Write-Output "packaged $zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacta-windows
          if-no-files-found: error
          retention-days: 14
          path: build/Pacta-windows-x64-release.zip

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          name: Pacta ${{ github.ref_name }}
